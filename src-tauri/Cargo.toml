[package]
name = "sumo-campaign-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

# SOVD client for observing/driving. https:// to match the orchestrator's
# transitive SOVDd source — the old ssh:// pin + ssh-only [patch] never
# reached the orchestrator's https-pinned sovd-client, so after the /updates
# wire landed the (current) orchestrator was built against a stale FlashClient.
# One https source per crate; no local patch (SOVDd + sumo-sovd are pushed).
sovd-client = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
# sovd-core: the EntityStatus/EntityStatusBody wire types for the converged
# /status endpoint (read_status). Same https source as sovd-client.
sovd-core = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }

# SUIT manifest parsing
sumo-onboard = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
sumo-crypto = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
sumo-codec = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }

# Campaign orchestrator (drive mode)
sumo-sovd-orchestrator = { git = "https://github.com/sdv-playground/sumo-sovd.git", branch = "main" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
